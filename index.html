    </button>
    <a class="mob-brand" href="#/templates">
      <img src="assets/logo-red.svg" alt="MARTINI FUSION FILMS">
      <span data-i18n="app.title">المركز القانوني</span>
    </a>
    <div class="mob-actions">
      <button type="button" id="btnMobLang" class="mob-act-btn" data-i18n="side.lang">English</button>
      <button type="button" id="btnMobLogout" class="mob-act-btn mob-logout-btn" title="Log out" aria-label="Log out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

    </div>
  </header>
  <aside class="side" id="sideNav">
    <div class="side-head-mob">
      <button type="button" id="btnSideClose" class="side-close-btn" aria-label="Close menu">&times;</button>
    </div>
    <a class="brand" href="#/templates"><img src="assets/logo-cream.svg" alt="MARTINI FUSION FILMS"><span class="brand-title" data-i18n="app.title"></span></a>
    <nav>
      <div class="nav-section-title" data-i18n="nav.master">الرئيسية</div>
      <a href="#/templates" data-r="templates" class="nav-master"><span data-i18n="nav.templates"></span></a>
      
      <div class="nav-section-title" data-i18n="nav.subpages">الصفحات الفرعية</div>
      <a href="#/projects" data-r="projects" class="nav-subpage"><span data-i18n="nav.projects"></span> <span class="n" id="nProjects">0</span></a>

    </nav>
    <div class="side-foot">
      <button id="btnLang" class="lang-btn" data-i18n="side.lang"></button>

    </div>

<div id="authGate" class="auth-overlay" style="display: none;">
  <div class="auth-card">
    <img src="assets/logo-red.svg" alt="MARTINI FUSION FILMS" class="auth-logo">
    <h2 class="auth-title" data-i18n="auth.title">تسجيل الدخول إلى المركز القانوني</h2>
    <p class="auth-sub" data-i18n="auth.sub">هذا النظام محمي. يرجى إدخال كلمة المرور للمتابعة.</p>
    <form id="authForm" class="auth-form" onsubmit="return false;">
      <div class="auth-input-wrap">
        <input type="password" id="authInput" class="auth-input" placeholder="كلمة المرور..." autocomplete="current-password" required autofocus>
        <button type="button" id="authToggleShow" class="auth-toggle-btn" aria-label="Show password" title="Show password">
          <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <div id="authErr" class="auth-err" data-i18n="auth.err">كلمة المرور غير صحيحة. يرجى إعادة المحاولة.</div>
      <button type="submit" id="authSubmit" class="auth-btn" data-i18n="auth.btn">دخول</button>
    </form>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="printHost" class="print-host"></div>
